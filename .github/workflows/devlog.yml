name: Weekly agent devlog

on:
  push:
  pull_request:
  schedule:
    - cron: '0 9 * * 5'
  workflow_dispatch:
    inputs:
      week:
        description: 'ISO week, for example 2026-W41 (blank: current UTC week)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python tools/devlog.py check

  weekly-preview:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select week
        id: week
        env:
          INPUT_WEEK: ${{ inputs.week }}
        run: |
          if [ -n "$INPUT_WEEK" ]; then
            echo "value=$INPUT_WEEK" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate review files
        run: python tools/devlog.py preview '${{ steps.week.outputs.value }}' --out 'devlog/previews/${{ steps.week.outputs.value }}'
      - uses: actions/upload-artifact@v4
        with:
          name: devlog-${{ steps.week.outputs.value }}-review
          path: devlog/previews/${{ steps.week.outputs.value }}/
          retention-days: 30
      - name: Open weekly review pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: devlog/weekly-preview-${{ steps.week.outputs.value }}
          add-paths: devlog/previews/${{ steps.week.outputs.value }}/
          commit-message: 'Devlog draft: ${{ steps.week.outputs.value }}'
          title: 'Devlog-Entwurf: ${{ steps.week.outputs.value }}'
          body: |
            Automatisch erzeugter Wochenentwurf zur redaktionellen Prüfung.

            - Prüfe Fakten, Quellen, Status und öffentliche Eignung.
            - Der Titel im Export ist nur das Freitagsdatum.
            - Dieser PR veröffentlicht nichts auf erzmark.de.
            - Live-Veröffentlichung bleibt ein separater, ausdrücklich freizugebender CMS-Schritt.
          draft: true
          delete-branch: true
